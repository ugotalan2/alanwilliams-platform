services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: alanwilliams-platform-frontend

    ports:
      - "5174:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      NODE_ENV: development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: alanwilliams-platform-backend

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/platform_dev
      SPRING_DATASOURCE_USERNAME: alanwilliams
      SPRING_DATASOURCE_PASSWORD: alanwilliams

    networks:
      - default
      - alanwilliams-backend

networks:
  alanwilliams-backend:
    external: true