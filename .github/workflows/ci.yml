name: CI Tests

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: platform_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_admin -d platform_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          GITHUB_ACTOR: ugotalan2

          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/platform_dev
          SPRING_DATASOURCE_USERNAME: postgres_admin
          SPRING_DATASOURCE_PASSWORD: test-password

          CLERK_ISSUER: https://flexible-swan-3121.clerk.accounts.dev
          CLERK_AUTHORIZED_PARTIES: http://localhost:5174
        run: ./mvnw -s settings.xml test

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build