name: CI Tests

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: platform_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_admin -d platform_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/platform_dev
          SPRING_DATASOURCE_USERNAME: postgres_admin
          SPRING_DATASOURCE_PASSWORD: test-password
        run: ./mvnw test

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test